[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music_atlas"
version = "0.1.0"
description = "Offline data pipeline for Music Atlas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
experiments = ["jupyter==1.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/music_atlas"]

[tool.pytest.ini_options]
# Python 3.12 reads editable-install .pth files in the locale encoding, which breaks
# on repo paths with non-ASCII characters. Put src/ on the path explicitly.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
